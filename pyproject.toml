[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ssh-log-analysis-llm"
version = "0.1.0"
description = "Evidence-grounded SSH incident extraction with reproducible QLoRA experiments"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.8.0",
  "transformers==4.57.1",
  "datasets==4.2.0",
  "peft==0.17.1",
  "trl==0.23.1",
  "bitsandbytes==0.48.1",
  "accelerate==1.10.1",
  "mlflow==3.4.0",
  "psutil==7.1.0",
  "matplotlib==3.11.2",
]

[project.scripts]
ssh-log-analysis = "ssh_log_analysis.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=.cache/pytest"

[tool.hatch.build.targets.wheel]
packages = ["src/ssh_log_analysis"]
